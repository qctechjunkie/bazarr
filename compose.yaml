# Bazarr - Sonarr and Radarr Subtitles Manager
# Manages and downloads subtitles based on your requirements

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}:/config
      - ${MOVIES_PATH}:/movies
      - ${TV_PATH}:/tv
    ports:
      - "${BAZARR_PORT}:6767"
    restart: ${RESTART_POLICY}
    networks:
      - arrnetwork

networks:
  arrnetwork:
    external: true
